name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Release (Windows x64)
    # Pinned: on windows-latest (Server 2025) Flutter's Visual Studio
    # detection fails ("Visual Studio 16 2019 could not find any instance").
    # The windows-2022 image ships VS 2022 with the components Flutter needs.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version from pubspec
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $version = $version.Split('+')[0]
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "App version: $version"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Bundle VC++ runtime DLLs
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $target = Join-Path $releaseDir $dll
            if (-not (Test-Path $target)) {
              Copy-Item "C:\Windows\System32\$dll" $target
              Write-Host "Bundled $dll"
            }
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" `
            -DestinationPath "gmh-$version-windows-x64-portable.zip"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $source = (Resolve-Path "build/windows/x64/runner/Release").Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=$version `
            /DSourceDir=$source `
            windows/installer/gmh.iss

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "GMH — Game Master's Hub v${{ steps.version.outputs.version }}"
          body: |
            Windows x64 build of **GMH — Game Master's Hub**, an offline-first
            world-building and campaign-management workspace for Dungeon Masters.

            **Downloads**
            - `gmh-${{ steps.version.outputs.version }}-setup-windows-x64.exe` — installer (recommended)
            - `gmh-${{ steps.version.outputs.version }}-windows-x64-portable.zip` — portable; unzip and run `gmh.exe`

            All data is stored locally under `Documents\gmh`. No account, no network required.
          files: |
            gmh-${{ steps.version.outputs.version }}-windows-x64-portable.zip
            windows/installer/Output/gmh-${{ steps.version.outputs.version }}-setup-windows-x64.exe
          fail_on_unmatched_files: true

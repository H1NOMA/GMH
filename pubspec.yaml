name: gmh
description: "GMH - Game Master's Hub. An offline-first world-building and campaign management workspace for Dungeon Masters."
publish_to: 'none'
version: 0.10.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Database
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  sqlite3: ^2.7.5

  # Rich text editor
  flutter_quill: ^11.4.1

  # Storage & files
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^10.1.9
  image_picker: ^1.1.2
  desktop_drop: ^0.6.1
  cross_file: ^0.3.4
  url_launcher: ^6.3.1

  # Export / backup
  archive: ^4.0.7
  pdf: ^3.11.3
  share_plus: ^11.0.0

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.6
  collection: ^1.19.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  image_path: "assets/icon/gmh_icon_1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#14100B"
  windows:
    generate: true
    image_path: "assets/icon/gmh_icon_1024.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/gmh_icon_macos_1024.png"

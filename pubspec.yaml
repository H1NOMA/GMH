name: gmh
description: "GMH - Game Master's Hub. An offline-first world-building and campaign management workspace for Dungeon Masters."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Database
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  sqlite3: ^2.7.5

  # Rich text editor
  flutter_quill: ^11.4.1

  # Storage & files
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^10.1.9
  image_picker: ^1.1.2

  # Export / backup
  archive: ^4.0.7
  pdf: ^3.11.3
  share_plus: ^11.0.0

  # Utilities
  uuid: ^4.5.1
  crypto: ^3.0.6
  collection: ^1.19.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
